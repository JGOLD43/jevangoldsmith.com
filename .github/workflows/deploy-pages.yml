name: deploy-pages

# Called directly after the test job succeeds; manual dispatch remains available
# for emergency redeployment. Keeping deployment in the same run avoids an
# additional workflow_run event after inbox -> sync -> test.
on:
  workflow_call:
    inputs:
      tested_sha:
        required: true
        type: string
      tested_run:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested_sha || github.sha }}

      - name: Download the exact successful test build
        if: inputs.tested_run != ''
        uses: actions/download-artifact@v4
        with:
          name: tested-site
          path: dist
          run-id: ${{ inputs.tested_run }}
          github-token: ${{ github.token }}

      - name: Verify build identity and reject obsolete deployments
        if: inputs.tested_run != ''
        env:
          EXPECTED_SHA: ${{ inputs.tested_sha }}
          EXPECTED_RUN: ${{ inputs.tested_run }}
        run: |
          node -e 'const r=require("./dist/api/v1/release.json"); if(r.sha!==process.env.EXPECTED_SHA || String(r.runId)!==process.env.EXPECTED_RUN) throw new Error("Tested artifact identity mismatch")'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        if: inputs.tested_run == ''
        with:
          node-version: 22
          cache: npm

      - name: Build emergency manual deployment
        if: inputs.tested_run == ''
        env:
          RUM_ENDPOINT: ${{ secrets.RUM_ENDPOINT }}
        run: |
          npm ci
          npm ci --prefix site-astro
          npm run people:merge
          npm run build:fast
          mkdir -p dist/api/v1
          node -e 'require("fs").writeFileSync("dist/api/v1/release.json", JSON.stringify({sha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,builtAt:new Date().toISOString()}))'
          touch dist/.nojekyll
          cp CNAME dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm the expected release on the custom domain
        run: node scripts/verify-published-release.js
        env:
          EXPECTED_SHA: ${{ inputs.tested_sha || github.sha }}
      - name: Live verification
        run: node scripts/check-live.js
        env:
          HOST: https://jevangoldsmith.com
