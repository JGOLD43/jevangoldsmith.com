name: deploy-pages

# Deploy is gated on the `test` workflow: a push to main runs `test`, and only
# when it concludes successfully does this workflow run. This prevents a broken
# build (or a bad auto-batch / cron data commit) from going live. Manual
# `workflow_dispatch` bypasses the gate for emergency redeploys.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only deploy when the gating test run passed (or on manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download the exact successful test build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: tested-site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify build identity and reject obsolete deployments
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          node -e 'const r=require("./dist/api/v1/release.json"); if(r.sha!==process.env.EXPECTED_SHA || String(r.runId)!==process.env.EXPECTED_RUN) throw new Error("Tested artifact identity mismatch")'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
          cache: npm

      - name: Build emergency manual deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          RUM_ENDPOINT: ${{ secrets.RUM_ENDPOINT }}
        run: |
          npm ci
          npm ci --prefix site-astro
          npm run people:merge
          npm run build:fast
          mkdir -p dist/api/v1
          node -e 'require("fs").writeFileSync("dist/api/v1/release.json", JSON.stringify({sha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,builtAt:new Date().toISOString()}))'
          touch dist/.nojekyll
          cp CNAME dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm the expected release on the custom domain
        run: node scripts/verify-published-release.js
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Live verification
        run: node scripts/check-live.js
        env:
          HOST: https://jevangoldsmith.com
