name: jgold-publish-sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jgold-publish-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: website

      - name: Check out private untrusted inbox as data only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JGOLD43/jgold-publishing-inbox
          ssh-key: ${{ secrets.JGOLD_INBOX_DEPLOY_KEY }}
          persist-credentials: false
          path: inbox

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install trusted dependencies
        working-directory: website
        run: npm ci

      - name: Validate and apply allowlisted public manifests
        working-directory: website
        run: node scripts/sync-jgold-publications.js --inbox=../inbox/submissions

      - name: Validate resulting public content
        working-directory: website
        run: npm run content:validate

      - name: Run publication security tests
        working-directory: website
        run: node --test tests/unit/jgold-publishing.test.js

      - name: Commit trusted data changes
        working-directory: website
        run: |
          if git diff --quiet -- data .jgold-publication-state.json; then
            echo "No new approved publications"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data .jgold-publication-state.json
          git commit -m "content: sync approved JGOLD publications"
          git push origin HEAD:main
